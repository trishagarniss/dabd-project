global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # /api/v1/metrics is deliberately unauthenticated and reachable only on the
  # internal Docker network; all business endpoints require x-api-key.
  - job_name: fdp-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: fdp-webhook
    static_configs:
      - targets: ["webhook-receiver:9001"]
